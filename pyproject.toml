[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sqlite-server"
version = "0.1.0"
description = "MCP server for SQLite with read/write tools and safety guards"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "agentforge_ru", email = "agentforge-ru@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]
keywords = ["mcp", "sqlite", "claude", "ai", "subagent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/agentforge-ru/mcp-sqlite-server"
Issues = "https://github.com/agentforge-ru/mcp-sqlite-server/issues"

[project.scripts]
mcp-sqlite-server = "mcp_sqlite_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
